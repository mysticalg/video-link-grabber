<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Link Grabber</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Video Link Grabber</h1>
        <p class="sub">Find video sources and save them locally.</p>
      </div>
      <button id="scanBtn" type="button" title="Rescan the current page">Rescan</button>
    </header>
    <main>
      <div class="listHeading">
        <span>ON THIS PAGE</span>
        <span id="resultCount" aria-live="polite"></span>
      </div>
      <div id="status" role="status" aria-live="polite">Looking for video sources…</div>
      <ul id="results" aria-label="Video sources"></ul>
      <template id="itemTpl">
        <li class="item">
          <div class="summary">
            <div class="thumbWrap"><img class="thumb" alt="" loading="lazy" referrerpolicy="no-referrer" /></div>
            <div class="meta">
              <span class="badge"></span>
              <div class="title"></div>
              <div class="details"><span class="type"></span><span class="size"></span></div>
              <div class="from"></div>
            </div>
          </div>
          <p class="help" hidden></p>
          <div class="actions">
            <button class="download" type="button">Download</button>
            <button class="record" type="button" hidden>Record while playing</button>
            <button class="copy" type="button">Copy URL</button>
            <a class="open" target="_blank" rel="noopener noreferrer">Open</a>
          </div>
          <p class="itemStatus" role="status" aria-live="polite" hidden></p>
        </li>
      </template>
    </main>
    <footer>Only save content you have permission to download. DRM is not supported. On X, play the video before scanning.</footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
